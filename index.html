<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification for Eligibility for WBMCC Counseling 2026</title>
    <!-- PDF.js Library for client-side PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1e293b;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .upload-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .file-name {
            font-weight: 600;
            color: #334155;
            margin-top: 10px;
            word-break: break-all;
        }

        input[type="file"] {
            display: none;
        }

        .api-section {
            margin-bottom: 20px;
        }

        .api-section label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .api-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }

        .api-input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-check {
            background-color: var(--primary);
            color: white;
        }

        .btn-check:hover {
            background-color: var(--primary-hover);
        }

        .btn-check:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-proceed {
            background-color: var(--success);
            color: white;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-proceed:hover {
            background-color: #15803d;
        }

        .status-box {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .status-box.success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .status-box.error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .status-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .status-details {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Verification for Eligibility for WBMCC Counseling 2026</h1>
        <p>Please upload your official NTA NEET (UG) 2026 Scorecard PDF</p>
    </div>

    <!-- PDF Upload Field -->
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('scoreCardInput').click()">
        <div class="upload-icon">📄</div>
        <div><strong>Click to upload</strong> or drag and drop</div>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">PDF format only</p>
        <div class="file-name" id="fileName"></div>
    </div>
    <input type="file" id="scoreCardInput" accept=".pdf" onchange="handleFileSelect(event)">

    <!-- Optional API Key Input for Live Gemini API -->
    <div class="api-section">
        <label for="apiKey">Gemini API Key (Optional - uses AI validation engine):</label>
        <input type="password" id="apiKey" class="api-input" placeholder="Enter special Key if you have any or leave empty for official parser verification">
    </div>

    <!-- Action Button -->
    <button class="btn btn-check" id="checkBtn" onclick="verifyEligibility()">
        <div class="spinner" id="btnSpinner"></div>
        <span id="btnText">Check Eligibility</span>
    </button>

    <!-- Results Display -->
    <div class="status-box" id="statusBox">
        <div class="status-title" id="statusTitle"></div>
        <div class="status-details" id="statusDetails"></div>
        <a id="proceedLink" class="btn btn-proceed" href="https://www.instagram.com/?hl=en" style="display: none;">
            Submit and Proceed
        </a>
    </div>
</div>

<script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let selectedFile = null;

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file && file.type === "application/pdf") {
            selectedFile = file;
            document.getElementById('fileName').innerText = `Selected: ${file.name}`;
            resetStatus();
        } else {
            alert("Please select a valid PDF file.");
        }
    }

    // Drag and drop handlers
    const uploadArea = document.getElementById('uploadArea');
    ['dragenter', 'dragover'].forEach(eventName => {
        uploadArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        uploadArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        }, false);
    });
    uploadArea.addEventListener('drop', (e) => {
        const file = e.dataTransfer.files[0];
        if (file && file.type === "application/pdf") {
            selectedFile = file;
            document.getElementById('scoreCardInput').files = e.dataTransfer.files;
            document.getElementById('fileName').innerText = `Selected: ${file.name}`;
            resetStatus();
        } else {
            alert("Please drop a valid PDF file.");
        }
    });

    function resetStatus() {
        const statusBox = document.getElementById('statusBox');
        statusBox.style.display = 'none';
        document.getElementById('proceedLink').style.display = 'none';
    }

    // Extract raw text from uploaded PDF using PDF.js
    async function extractTextFromPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ");
            fullText += pageText + " ";
        }
        return fullText;
    }

    // Background Gemini AI Verification
    async function verifyEligibility() {
        if (!selectedFile) {
            alert("Please submit your Score Card in PDF format first.");
            return;
        }

        const checkBtn = document.getElementById('checkBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const apiKey = document.getElementById('apiKey').value.trim();

        // UI Loading state
        checkBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.innerText = 'Verifying with Background AI Agent...';
        resetStatus();

        try {
            // Extract text content from PDF
            const pdfText = await extractTextFromPDF(selectedFile);
            const promptInput = "check the PDF has 695 and 218 numbers present on it or not.";

            let has695 = false;
            let has218 = false;

            if (apiKey) {
                // Background Call to Gemini AI API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: `Document Text: "${pdfText}"\n\nTask: ${promptInput}\nRespond strictly in JSON format: {"has695": boolean, "has218": boolean}` }
                            ]
                        }]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    try {
                        const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                        if (jsonMatch) {
                            const parsed = JSON.parse(jsonMatch[0]);
                            has695 = parsed.has695;
                            has218 = parsed.has218;
                        }
                    } catch (e) {
                        has695 = pdfText.includes('695');
                        has218 = pdfText.includes('218');
                    }
                } else {
                    // Fallback to text evaluation if API fails
                    has695 = pdfText.includes('695');
                    has218 = pdfText.includes('218');
                }
            } else {
                // Client-side AI parser execution fallback
                has695 = pdfText.includes('695');
                has218 = pdfText.includes('218');
            }

            displayResult(has695 && has218);

        } catch (error) {
            console.error("Verification Error:", error);
            alert("Error reading PDF file. Please ensure it is a valid document.");
        } finally {
            checkBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnText.innerText = 'Check Eligibility';
        }
    }

    function displayResult(isEligible) {
        const statusBox = document.getElementById('statusBox');
        const statusTitle = document.getElementById('statusTitle');
        const statusDetails = document.getElementById('statusDetails');
        const proceedLink = document.getElementById('proceedLink');

        statusBox.style.display = 'block';

        if (isEligible) {
            statusBox.className = 'status-box success';
            statusTitle.innerText = 'Candidate is eligible!';
            statusDetails.innerHTML = 'Score: <strong>695</strong><br>AIR (All India Rank): <strong>218</strong>';
            proceedLink.style.display = 'block';
        } else {
            statusBox.className = 'status-box error';
            statusTitle.innerText = 'Candidate is not eligible.';
            statusDetails.innerText = 'The required eligibility criteria were not met in the uploaded scorecard.';
            proceedLink.style.display = 'none';
        }
    }
</script>

</body>
</html>
